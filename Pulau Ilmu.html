/* Layout: peta laut dengan pulau-pulau besar yang bisa diketuk; Perpustakaan Soal adalah daftar soal dan jawaban yang bisa disaring. */
:root{
  --sea:#d9eff1; --sea2:#c6e5e9; --card:#ffffff; --card2:#f0f9fa; --ink:#0c2d3a; --muted:#47646e;
  --line:#b4d5db; --sun:#f5b50a; --sun-ink:#2b1f00; --pen:#0b6b8a; --pen-ink:#ffffff;
  --good:#16794f; --good-bg:#dcf4e8; --bad:#c3283c; --bad-bg:#fde5e8;
  --i1:#f2c14e; --i2:#7cc98f; --i3:#f29a8c; --i4:#b49be0; --i5:#74bdea; --i6:#f2a860; --isle-ink:#0c2d3a;
  --display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#092732; --sea2:#0d3542; --card:#0f3341; --card2:#154151; --ink:#e4f4f7; --muted:#9fc3cc;
    --line:#1f5262; --pen:#62d2f2; --pen-ink:#06222b;
    --good:#5fdba6; --good-bg:#123a2e; --bad:#ff8393; --bad-bg:#3d1a22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sea:#092732; --sea2:#0d3542; --card:#0f3341; --card2:#154151; --ink:#e4f4f7; --muted:#9fc3cc;
  --line:#1f5262; --pen:#62d2f2; --pen-ink:#06222b;
  --good:#5fdba6; --good-bg:#123a2e; --bad:#ff8393; --bad-bg:#3d1a22; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--sea);
  background-image:radial-gradient(circle at 50% 100%, transparent 0 10px, var(--sea2) 10px 11.5px, transparent 11.5px);
  background-size:30px 15px;
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:720px; margin:0 auto; min-width:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--pen); outline-offset:2px}
h1,h2,h3{font-family:var(--display); font-weight:400; line-height:1.1; text-wrap:balance; margin:0}
p{margin:0}

.eyebrow{font-size:.8rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
h1{font-size:clamp(2.8rem, 12vw, 4.4rem); color:var(--pen); margin-top:4px; text-decoration:underline wavy var(--sun) 3px; text-underline-offset:10px; text-decoration-skip-ink:none}
.lede{color:var(--muted); max-width:54ch; margin-top:16px}
.mast{margin-bottom:18px}

.tabs{display:flex; gap:6px; padding:5px; background:var(--card); border:2px solid var(--line); border-radius:14px; margin-bottom:18px}
.tabs button{flex:1; min-height:44px; border:0; border-radius:10px; background:transparent; font-weight:700}
.tabs button[aria-current="page"]{background:var(--pen); color:var(--pen-ink)}

.lab{font-family:var(--body); font-size:.8rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:42px; padding:6px 15px; border-radius:999px; border:2px solid var(--line); background:var(--card); font-weight:700; font-variant-numeric:tabular-nums}
.chip .n{margin-left:6px; opacity:.75; font-weight:400}
.chip[aria-pressed="true"]{background:var(--pen); border-color:var(--pen); color:var(--pen-ink)}
.chip:hover{border-color:var(--pen)}

.sum{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 16px; display:grid; gap:8px}
.sum b{font-variant-numeric:tabular-nums}
.meter{height:12px; border-radius:99px; background:var(--card2); border:1px solid var(--line); overflow:hidden}
.meter i{display:block; height:100%; background:var(--sun); border-radius:99px}

/* pulau */
.isles{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:22px 14px; margin:8px 0 34px; padding-bottom:16px}

.isle{
  position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:2px; text-align:left;
  min-height:156px; padding:20px 20px 18px; border:0; color:var(--isle-ink); background:var(--ic);
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%;
  box-shadow:0 7px 0 rgba(0,0,0,.2), inset 0 -12px 0 rgba(255,255,255,.2);
}
.isle:nth-child(2){border-radius:44% 56% 42% 58% / 55% 45% 55% 45%}
.isle:nth-child(3){border-radius:52% 48% 60% 40% / 42% 58% 42% 58%}
.isle:nth-child(4){border-radius:46% 54% 48% 52% / 58% 44% 56% 42%}
.isle:nth-child(5){border-radius:60% 40% 50% 50% / 46% 52% 48% 54%}
.isle:nth-child(6){border-radius:42% 58% 56% 44% / 52% 48% 52% 48%}
.isle:nth-child(even){transform:translateY(14px)}
.isle:not(:disabled):hover{filter:brightness(1.06)}
.isle:disabled{opacity:.5; cursor:not-allowed}
.isle .pl{font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.8}
.isle .nm{font-family:var(--display); font-size:1.5rem; line-height:1.05}
.isle .gm{font-size:.92rem; font-weight:700; font-variant-numeric:tabular-nums; margin-top:4px}
.isle .bar{display:block; width:100%; height:7px; border-radius:99px; background:rgba(12,45,58,.22); overflow:hidden}
.isle .bar i{display:block; height:100%; background:var(--isle-ink)}
.isle .lh{margin-top:4px; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:var(--sun); color:var(--sun-ink); border-radius:99px; padding:1px 10px}

.go{margin-top:6px; width:100%; min-height:54px; border:0; border-radius:14px; background:var(--pen); color:var(--pen-ink); font-family:var(--display); font-size:1.35rem; box-shadow:0 5px 0 rgba(0,0,0,.22)}
.go:disabled{opacity:.45; cursor:not-allowed}
.go:not(:disabled):hover{filter:brightness(1.08)}
.sec{background:var(--card); color:var(--ink); border:2px solid var(--line); box-shadow:none}
.ghost{min-height:44px; padding:8px 16px; border-radius:12px; border:2px dashed var(--pen); background:var(--card); color:var(--pen); font-weight:700}
.ghost:disabled{opacity:.45; cursor:not-allowed; border-style:solid; border-color:var(--line); color:var(--muted)}
.quit{border-color:var(--line); color:var(--muted)}

/* main */
.hud{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; font-weight:700; font-variant-numeric:tabular-nums}
.hud .streak{color:var(--pen)}
.timerrow{display:flex; align-items:center; gap:10px; margin:10px 0 14px}
.timer{flex:1; height:12px; border-radius:99px; background:var(--card); border:1px solid var(--line); overflow:hidden}
.timer i{display:block; height:100%; width:100%; background:var(--pen)}
.timer i.low{background:var(--bad)}
.tt{min-width:2.2ch; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
.q{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:18px}
.tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.tag{font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 10px; border-radius:99px; background:var(--card2); border:1px solid var(--line); color:var(--muted)}
.q h2{font-size:clamp(1.4rem, 5vw, 1.85rem)}
.q h2:focus{outline:none}
.opts{display:grid; gap:10px; margin-top:14px}
.opt{display:flex; align-items:center; gap:12px; text-align:left; width:100%; min-height:56px; padding:10px 14px; border-radius:14px; border:2px solid var(--line); background:var(--card); font-weight:700}
.opt .k{flex:none; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--card2); border:1.5px solid var(--line); font-size:.85rem}
.opt:not(:disabled):hover{border-color:var(--pen)}
.opt.ok{border-color:var(--good); background:var(--good-bg)}
.opt.ok .k{background:var(--good); color:var(--card); border-color:var(--good)}
.opt.no{border-color:var(--bad); background:var(--bad-bg)}
.opt.no .k{background:var(--bad); color:var(--card); border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt.gone{opacity:.4; text-decoration:line-through}
.opt:disabled{cursor:default}
.tools{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:14px}
.fb{margin-top:14px; border-radius:16px; padding:14px 16px; border:2px solid var(--line); background:var(--card)}
.fb.ok{border-color:var(--good); background:var(--good-bg)}
.fb.no{border-color:var(--bad); background:var(--bad-bg)}
.fb h3{font-size:1.3rem; margin-bottom:4px}
.fb .go{margin-top:12px; min-height:50px; font-size:1.15rem}

/* hasil + perpustakaan */
.res{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:18px; display:grid; gap:12px}
.big{font-family:var(--display); font-size:3.4rem; color:var(--pen); line-height:1; font-variant-numeric:tabular-nums}
.big small{font-family:var(--body); font-size:1rem; color:var(--muted); font-weight:700; margin-left:6px}
.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px}
.stat{background:var(--card2); border-radius:12px; padding:8px 12px}
.stat span{display:block; font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stat b{font-size:1.25rem; font-variant-numeric:tabular-nums}
.new{width:max-content; padding:2px 12px; border-radius:99px; background:var(--sun); color:var(--sun-ink); font-size:.78rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.row2 .go{margin-top:0}
.fl{margin-top:22px; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:14px 16px}
.fl h2{font-size:1.5rem; margin-bottom:2px}
.sub{color:var(--muted); font-size:.95rem; margin-bottom:10px}
.ctl{display:grid; gap:12px; margin-bottom:12px}
.fld{display:grid; gap:4px}
.fld label,.fld .ln{font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
select,input[type="search"]{min-height:44px; padding:6px 12px; border-radius:12px; border:2px solid var(--line); background:var(--card2); color:var(--ink); width:100%; max-width:100%}
.chk{display:flex; align-items:center; gap:10px; min-height:44px; font-weight:700}
.chk input{width:22px; height:22px; accent-color:var(--pen)}
.cnt{font-weight:700; color:var(--muted); font-size:.92rem; margin:6px 0}
.rl{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:10px}
.ri{border:2px solid var(--line); border-left-width:7px; border-radius:12px; padding:12px 14px; background:var(--card2); min-width:0}
.ri.benar{border-left-color:var(--good)} .ri.salah{border-left-color:var(--bad)} .ri.waktu{border-left-color:var(--muted)} .ri.belum{border-left-color:var(--line)}
.rh{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:4px}
.badge{font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:1px 10px; border-radius:99px; border:1.5px solid currentColor}
.benar .badge{color:var(--good)} .salah .badge{color:var(--bad)} .waktu .badge,.belum .badge{color:var(--muted)}
.meta{font-size:.82rem; color:var(--muted); font-weight:700}
.rq{font-weight:700; overflow-wrap:anywhere}
.ra{font-size:.95rem; overflow-wrap:anywhere}
.re{font-size:.92rem; color:var(--muted); margin-top:6px}
.ol{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px}
.ol li{display:flex; gap:10px; align-items:baseline; padding:6px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--card); overflow-wrap:anywhere}
.ol li b{flex:none; font-size:.8rem; color:var(--muted)}
.ol li.ok{border-color:var(--good); background:var(--good-bg)}
.ol li .mk{margin-left:auto; flex:none; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--good)}
.tg{margin-top:8px; min-height:40px; padding:4px 14px; border-radius:10px; border:2px solid var(--pen); background:transparent; color:var(--pen); font-weight:700}
.empty{padding:16px; text-align:center; color:var(--muted); border:2px dashed var(--line); border-radius:12px; list-style:none}
.reset{margin-top:22px; min-height:44px; padding:6px 16px; border-radius:12px; border:2px solid var(--line); background:transparent; color:var(--muted); font-weight:700}
.reset.sure{border-color:var(--bad); color:var(--bad)}
@media (prefers-reduced-motion: no-preference){
  .timer i{transition:width .2s linear}
  .isle,.chip,.go,.opt{transition:filter .15s, border-color .15s, background-color .15s}
}
</style>

var LV={1:"Mudah",2:"Sedang",3:"Sulit"}, BASE={1:10,2:15,3:20}, TIME=20, NQ=5, KEY="pulau-ilmu-progres", LET=["A","B","C","D"];
var CATS=[]; Q.forEach(function(x){ if(CATS.indexOf(x.c)<0) CATS.push(x.c); });
var app=document.getElementById("app");

function load(){ try{ var s=localStorage.getItem(KEY); var o=s?JSON.parse(s):{}; return (o&&typeof o==="object")?o:{}; }catch(e){ return {}; } }
var P=load();

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function stat(q){ var r=P[q.q]; return r&&r.last?r.last:"belum"; }

}

/* ---------- Pelayaran ---------- */
function sail(cat){
  var pool=Q.filter(function(q){ return (cat==="*"||q.c===cat)&&(S.lvl===0||q.l===S.lvl); });
  if(!pool.length) return;
  var g1=[],g2=[],g3=[];
  pool.forEach(function(q){ var s=stat(q); (s==="belum"?g1:s==="salah"?g2:g3).push(q); });
  S.list=shuffle(g1).concat(shuffle(g2),shuffle(g3)).slice(0,NQ);
  S.cat=cat; S.i=0; S.score=0; S.streak=0; S.fifty=2; S.answers=[]; S.gained=0; R.st="semua"; R.l=0;
  viewPlay();
}
function viewPlay(){
  var q=S.list[S.i];
  S.opts=shuffle(q.o.map(function(t,k){ return {t:t,ok:k===q.a,gone:false}; }));

  app.innerHTML=
   '<div class="hud"><span>'+(S.cat==="*"?"Semua pulau":"Pulau "+esc(S.cat))+' · soal <b>'+(S.i+1)+'</b>/'+S.list.length+'</span><span class="streak" id="st"></span><span>Skor <b id="sc">'+S.score+'</b></span></div>'+

   '<article class="q"><div class="tags"><span class="tag">'+esc(q.c)+'</span><span class="tag">'+LV[q.l]+'</span></div><h2 id="qt" tabindex="-1">'+esc(q.q)+'</h2></article>'+
   '<div class="opts" id="opts">'+S.opts.map(function(o,i){ return '<button type="button" class="opt" data-a="pick" data-v="'+i+'"><span class="k">'+LET[i]+'</span><span>'+esc(o.t)+'</span></button>'; }).join("")+'</div>'+
   '<div class="tools"><button type="button" class="ghost" id="f50" data-a="fifty"></button><button type="button" class="ghost quit" data-a="quit">Kembali ke peta</button></div>'+
   '<div class="fb" id="fb" role="status" hidden></div>';
  upd50(); updStreak(); document.getElementById("qt").focus({preventScroll:true}); startTimer(); window.scrollTo(0,0);
}
function updStreak(){ var e=document.getElementById("st"); if(e) e.textContent=S.streak>=2?"Runtun "+S.streak:""; }
function upd50(){ var b=document.getElementById("f50"); if(!b) return; b.textContent="Filter 50:50 (sisa "+S.fifty+")"; b.disabled=S.fifty<=0||S.locked||S.used50; }
function useFifty(){
  if(S.locked||S.used50||S.fifty<=0) return;
  S.used50=true; S.fifty--;
  var wrong=shuffle(S.opts.map(function(o,i){return i;}).filter(function(i){return !S.opts[i].ok;})).slice(0,2);
  var btns=document.querySelectorAll("#opts .opt");
  wrong.forEach(function(i){ S.opts[i].gone=true; btns[i].classList.add("gone"); btns[i].disabled=true; btns[i].setAttribute("aria-label",btns[i].textContent.slice(1)+" (disaring)"); });
  upd50();
}
function startTimer(){ stopTimer(); S.end=Date.now()+TIME*1000; tick(); S.timer=setInterval(tick,200); }
function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }
function tick(){
  S.left=Math.max(0,(S.end-Date.now())/1000);
  var tb=document.getElementById("tb"), tt=document.getElementById("tt"); if(!tb||!tt) return;
  tb.style.width=(S.left/TIME*100)+"%"; tb.classList.toggle("low",S.left<=5); tt.textContent=Math.ceil(S.left);
  tb.parentNode.setAttribute("aria-valuenow",String(Math.ceil(S.left)));
  if(S.left<=0) settle(-1);
}
function settle(i){
  if(S.locked) return; S.locked=true; stopTimer();
  var q=S.list[S.i], picked=i>=0?S.opts[i]:null, status=!picked?"waktu":(picked.ok?"benar":"salah"), pts=0;
  if(status==="benar"){ S.streak++; pts=BASE[q.l]+Math.floor(S.left/5)+(S.streak>=3?5:0); S.score+=pts; } else S.streak=0;
  var rec=P[q.q]; if(!rec){ rec={ok:false,last:""}; P[q.q]=rec; }
  rec.last=status==="benar"?"benar":"salah";
  if(status==="benar"&&!rec.ok){ rec.ok=true; S.gained++; }
  save();
  S.answers.push({q:q,status:status,picked:picked?picked.t:null,correct:q.o[q.a],pts:pts});
  var btns=document.querySelectorAll("#opts .opt");
  S.opts.forEach(function(o,k){ btns[k].disabled=true; if(o.ok) btns[k].classList.add("ok"); else if(k===i) btns[k].classList.add("no"); else if(!o.gone) btns[k].classList.add("dim"); });
  document.getElementById("sc").textContent=S.score; updStreak(); upd50();
  var last=S.i===S.list.length-1, fb=document.getElementById("fb");
  var head=status==="benar"?"Benar! +"+pts+" poin":status==="salah"?"Belum tepat":"Waktu habis";
  fb.className="fb "+(status==="benar"?"ok":status==="salah"?"no":"");
  fb.innerHTML='<h3>'+head+'</h3>'+(status==="benar"?'':'<p>Jawaban yang benar: <b>'+esc(q.o[q.a])+'</b></p>')+'<p>'+esc(q.e)+'</p><button type="button" class="go" id="nx" data-a="next">'+(last?"Lihat hasil":"Soal berikutnya")+'</button>';
  fb.hidden=false; document.getElementById("nx").focus();
}

/* ---------- Hasil ---------- */

   '<div class="ctl"><div class="fld"><span class="ln">Status jawaban</span><div class="chips" id="rst">'+["semua","benar","salah","waktu"].map(function(k){ return chip("rst",k,{semua:"Semua",benar:"Benar",salah:"Salah",waktu:"Waktu habis"}[k],R.st===k,0); }).join("")+'</div></div>'+

   '<ul class="rl" id="rlist"></ul></section>';
  drawReview(); window.scrollTo(0,0);

  var inL=S.answers.filter(function(a){ return !R.l||a.q.l===R.l; });

    b.querySelector(".n").textContent=n;
  });
  var items=inL.filter(function(a){ return R.st==="semua"||a.status===R.st; });
  var nm={benar:"Benar",salah:"Salah",waktu:"Waktu habis"};
  document.getElementById("rlist").innerHTML=items.length?items.map(function(a){
    return '<li class="ri '+a.status+'"><div class="rh"><span class="badge">'+nm[a.status]+'</span><span class="meta">'+esc(a.q.c)+' · '+LV[a.q.l]+(a.pts?' · +'+a.pts+' poin':'')+'</span></div>'+
      '<p class="rq">'+esc(a.q.q)+'</p>'+(a.status==="salah"?'<p class="ra">Jawabanmu: <b>'+esc(a.picked)+'</b></p>':'')+
      '<p class="ra">'+(a.status==="benar"?'Jawabanmu':'Jawaban benar')+': <b>'+esc(a.correct)+'</b></p><p class="re">'+esc(a.q.e)+'</p></li>';
  }).join(""):'<li class="empty">Tidak ada jawaban dengan filter ini.</li>';
}

/* ---------- Perpustakaan soal ---------- */
function lm(q,skipSt){
  if(L.c!=="semua"&&q.c!==L.c) return false;
  if(L.l&&q.l!==L.l) return false;
  if(!skipSt&&L.st!=="semua"&&stat(q)!==L.st) return false;
  if(L.qs){ var h=(q.q+" "+q.o.join(" ")+" "+q.e).toLowerCase(); if(h.indexOf(L.qs.toLowerCase())<0) return false; }
  return true;
}
function viewPustaka(){
  stopTimer(); sure=false;
  app.innerHTML=
   '<header class="mast"><p class="eyebrow">'+Q.length+' soal dan jawaban</p><h1>Perpustakaan</h1>'+
   '<p class="lede">Semua soal dan jawabannya ada di sini. Saring menurut pulau, tingkat, status, atau kata yang kamu cari.</p></header>'+
   tabs("pustaka")+
   '<div class="ctl">'+
   '<div class="fld"><label for="qs">Cari kata</label><input type="search" id="qs" placeholder="Contoh: fotosintesis" value="'+esc(L.qs)+'" autocomplete="off"></div>'+
   '<div class="fld"><label for="fc">Pulau</label><select id="fc"><option value="semua">Semua pulau</option>'+CATS.map(function(c){ return '<option value="'+esc(c)+'"'+(L.c===c?' selected':'')+'>'+esc(c)+'</option>'; }).join("")+'</select></div>'+
   '<div class="fld"><span class="ln">Tingkat soal</span><div class="chips">'+LVCH.map(function(p){ return chip("llvl",p[0],p[1],L.l===p[0]); }).join("")+'</div></div>'+
   '<div class="fld"><span class="ln">Status jawabanmu</span><div class="chips">'+[["semua","Semua"],["belum","Belum dijawab"],["benar","Benar"],["salah","Salah"]].map(function(p){ return chip("lst",p[0],p[1],L.st===p[0],0); }).join("")+'</div></div>'+
   '<label class="chk" for="showall"><input type="checkbox" id="showall"'+(L.show?' checked':'')+'> Tampilkan semua jawaban</label></div>'+
   '<p class="cnt" id="cnt" aria-live="polite"></p><ul class="rl" id="lib"></ul>'+
   '<button type="button" class="reset" id="rs" data-a="reset">Mulai ulang progres permata</button>';
  drawLib(); window.scrollTo(0,0);
}
function drawLib(){
  var base=Q.filter(function(q){ return lm(q,true); });
  Array.prototype.forEach.call(app.querySelectorAll('[data-g="lst"]'),function(b){
    var k=b.getAttribute("data-v"); b.querySelector(".n").textContent=base.filter(function(q){ return k==="semua"||stat(q)===k; }).length;
  });
  var items=Q.filter(function(q){ return lm(q,false); });
  document.getElementById("cnt").textContent="Menampilkan "+items.length+" dari "+Q.length+" soal";
  var nm={benar:"Sudah benar",salah:"Perlu diulang",belum:"Belum dijawab"};
  document.getElementById("lib").innerHTML=items.length?items.map(function(q){
    var idx=Q.indexOf(q), s=stat(q), open=L.show||REV[idx];
    return '<li class="ri '+s+'" data-i="'+idx+'"><div class="rh"><span class="badge">'+nm[s]+'</span><span class="meta">'+esc(q.c)+' · '+LV[q.l]+'</span></div>'+
      '<p class="rq">'+esc(q.q)+'</p><ul class="ol">'+q.o.map(function(t,k){ var ok=open&&k===q.a; return '<li'+(ok?' class="ok"':'')+'><b>'+LET[k]+'</b><span>'+esc(t)+'</span>'+(ok?'<span class="mk">Jawaban benar</span>':'')+'</li>'; }).join("")+'</ul>'+
      (open?'<p class="re">'+esc(q.e)+'</p>':'')+
      (L.show?'':'<button type="button" class="tg" data-a="rev" data-v="'+idx+'">'+(open?"Sembunyikan jawaban":"Lihat jawaban")+'</button>')+'</li>';
  }).join(""):'<li class="empty">Tidak ada soal dengan filter ini. Longgarkan filter atau ganti kata pencarian.</li>';
  var rs=document.getElementById("rs"); if(rs){ rs.textContent=sure?"Yakin hapus progres? Klik sekali lagi":"Mulai ulang progres permata"; rs.className="reset"+(sure?" sure":""); }
}

/* ---------- Event ---------- */
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]"); if(!el||el.disabled) return;
  var a=el.getAttribute("data-a"), v=el.getAttribute("data-v");
  if(a==="tab"){ if(v==="peta") viewPeta(); else viewPustaka(); }
  else if(a==="sail") sail(v);
  else if(a==="again") sail(S.cat);
  else if(a==="map"||a==="quit") viewPeta();
  else if(a==="pick") settle(parseInt(v,10));
  else if(a==="fifty") useFifty();
  else if(a==="next"){ if(S.i<S.list.length-1){ S.i++; viewPlay(); } else viewResult(); }
  else if(a==="f"){
    var g=el.getAttribute("data-g"); setPressed(g,v);
    if(g==="mlvl"){ S.lvl=parseInt(v,10); drawIslands(); }
    else if(g==="llvl"){ L.l=parseInt(v,10); drawLib(); }
    else if(g==="lst"){ L.st=v; drawLib(); }
    else if(g==="rst"){ R.st=v; drawReview(); }
  }
  else if(a==="rev"){
    var i=parseInt(v,10); REV[i]=!REV[i]; drawLib();
    var nb=app.querySelector('li[data-i="'+i+'"] .tg'); if(nb) nb.focus();
  }
  else if(a==="reset"){
    if(sure){ P={}; save(); REV={}; sure=false; } else sure=true;
    drawLib();
  }
});
app.addEventListener("input",function(e){ if(e.target.id==="qs"){ L.qs=e.target.value.trim(); drawLib(); } });
app.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="fc"){ L.c=e.target.value; drawLib(); }
  else if(id==="showall"){ L.show=e.target.checked; drawLib(); }
  else if(id==="rl"){ R.l=parseInt(e.target.value,10); drawReview(); }
});
viewPeta();
})();
</script>

</body></html>
